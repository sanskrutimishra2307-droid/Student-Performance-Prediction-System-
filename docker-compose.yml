version: '3.8'

services:
  # Primary: FastAPI REST API & Modern Web Dashboard
  web-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student_performance_api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped

  # Secondary: Streamlit Enterprise Dashboard
  streamlit-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student_performance_streamlit
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    restart: unless-stopped
